<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Quatro destinos para uma etapa de processo</title><desc id="desc">Uma sequência mostra eliminar, simplificar, automatizar e usar agente conforme cresce a necessidade de julgamento.</desc><rect width="1100" height="620" rx="24" fill="#f7f3eb"/><text x="60" y="72" fill="#25143f" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">Quatro destinos para cada etapa</text><text x="60" y="108" fill="#665d6e" font-family="Inter,Arial,sans-serif" font-size="17">Comece pela menor complexidade capaz de resolver o problema.</text><g font-family="Inter,Arial,sans-serif"><rect x="70" y="190" width="205" height="235" rx="24" fill="#eadfd6"/><text x="172" y="245" text-anchor="middle" fill="#713f34" font-size="24" font-weight="800">1. ELIMINAR</text><text x="172" y="290" text-anchor="middle" fill="#594c48" font-size="17">não cria valor</text><text x="172" y="320" text-anchor="middle" fill="#594c48" font-size="17">não precisa existir</text><rect x="320" y="190" width="205" height="235" rx="24" fill="#e7dfc8"/><text x="422" y="245" text-anchor="middle" fill="#66501d" font-size="24" font-weight="800">2. SIMPLIFICAR</text><text x="422" y="290" text-anchor="middle" fill="#594f38" font-size="17">menos campos</text><text x="422" y="320" text-anchor="middle" fill="#594f38" font-size="17">menos passagens</text><rect x="570" y="190" width="205" height="235" rx="24" fill="#dce9e2"/><text x="672" y="245" text-anchor="middle" fill="#315f4d" font-size="24" font-weight="800">3. AUTOMATIZAR</text><text x="672" y="290" text-anchor="middle" fill="#466157" font-size="17">regra conhecida</text><text x="672" y="320" text-anchor="middle" fill="#466157" font-size="17">execução previsível</text><rect x="820" y="190" width="205" height="235" rx="24" fill="#ddd5eb"/><text x="922" y="245" text-anchor="middle" fill="#49316d" font-size="24" font-weight="800">4. AGENCIAR</text><text x="922" y="290" text-anchor="middle" fill="#584a6a" font-size="17">há ambiguidade</text><text x="922" y="320" text-anchor="middle" fill="#584a6a" font-size="17">julgamento ajuda</text></g><path d="M120 500H980" stroke="#8067a8" stroke-width="5" stroke-linecap="round"/><path d="M955 480l28 20-28 20" fill="none" stroke="#8067a8" stroke-width="5"/><text x="550" y="550" text-anchor="middle" fill="#5b5264" font-family="Inter,Arial,sans-serif" font-size="18">mais complexidade somente quando ela compra capacidade real</text></svg>