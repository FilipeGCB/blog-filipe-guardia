<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Camadas de um agente operacional</title>
  <desc id="desc">Diagrama em quatro camadas: modelo, harness, regras do produto e trabalho real, destacando que cada uma possui responsabilidades diferentes.</desc>
  <rect width="1200" height="720" rx="30" fill="#f7f6fb"/>
  <text x="72" y="76" fill="#17152a" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800">Do modelo ao trabalho: quatro responsabilidades diferentes</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="90" y="125" width="1020" height="112" rx="24" fill="#ece8ff" stroke="#7765c7" stroke-width="3"/>
    <text x="130" y="173" fill="#342a6a" font-size="24" font-weight="800">1 · MODELO</text>
    <text x="130" y="207" fill="#514a70" font-size="20">interpreta contexto · raciocina · escolhe próximos passos</text>
    <path d="M600 238 V267" stroke="#7c739b" stroke-width="4"/>
    <path d="M589 258 L600 270 L611 258" fill="none" stroke="#7c739b" stroke-width="4"/>
    <rect x="90" y="276" width="1020" height="132" rx="24" fill="#e8f8f5" stroke="#45a99b" stroke-width="3"/>
    <text x="130" y="324" fill="#175b52" font-size="24" font-weight="800">2 · HARNESS</text>
    <text x="130" y="358" fill="#3f6661" font-size="20">sessão · compactação de contexto · ferramentas · aprovações · recuperação</text>
    <text x="130" y="388" fill="#3f6661" font-size="18">mantém o agente avançando durante uma tarefa longa</text>
    <path d="M600 409 V438" stroke="#7c739b" stroke-width="4"/>
    <path d="M589 429 L600 441 L611 429" fill="none" stroke="#7c739b" stroke-width="4"/>
    <rect x="90" y="447" width="1020" height="112" rx="24" fill="#fff3dd" stroke="#c8973e" stroke-width="3"/>
    <text x="130" y="495" fill="#6d4b0d" font-size="24" font-weight="800">3 · PRODUTO E GOVERNANÇA</text>
    <text x="130" y="529" fill="#725f3e" font-size="20">regras · permissões · critérios de sucesso · auditoria · experiência humana</text>
    <path d="M600 560 V589" stroke="#7c739b" stroke-width="4"/>
    <path d="M589 580 L600 592 L611 580" fill="none" stroke="#7c739b" stroke-width="4"/>
    <rect x="90" y="598" width="1020" height="86" rx="24" fill="#171c31"/>
    <text x="130" y="650" fill="#ffffff" font-size="24" font-weight="800">4 · TRABALHO REAL</text>
    <text x="410" y="650" fill="#d1cde4" font-size="20">arquivos · sistemas · pessoas · decisões · efeitos no mundo</text>
  </g>
</svg>
