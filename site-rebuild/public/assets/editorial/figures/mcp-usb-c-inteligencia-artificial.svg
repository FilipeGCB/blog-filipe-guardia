<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">MCP</title>
  <desc id="desc">Diagrama de um contrato MCP conectando dados, ferramentas, memória e permissão sem cobrir o nó central.</desc>
  <rect width="1200" height="660" fill="#f4f0e9"/>
  <path d="M0 94H1200M0 560H1200M72 0V660M1128 0V660" stroke="#d9d1c5" stroke-width="1" opacity=".8"/>
  <circle cx="1038" cy="100" r="180" fill="#7652a8" opacity=".08"/>
  <circle cx="110" cy="560" r="142" fill="#bb8754" opacity=".08"/>
  <text x="86" y="112" fill="#3d235c" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5">MCP</text>
  <text x="86" y="143" fill="#6c6670" font-family="Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">um contrato para conectar</text>
  <text x="86" y="610" fill="#6c6670" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">DIAGRAMA EDITORIAL</text>

  <path class="mcp-connector" d="M520.6 329.6L255.5 227.9" stroke="#bb8754" stroke-width="5" fill="none"/>
  <path class="mcp-connector" d="M671.7 314.4L801.4 231.8" stroke="#2e7564" stroke-width="5" fill="none"/>
  <path class="mcp-connector" d="M520.6 390.4L255.5 492.1" stroke="#7652a8" stroke-width="5" fill="none"/>
  <path class="mcp-connector" d="M671.7 405.6L801.4 488.2" stroke="#9c5856" stroke-width="5" fill="none"/>

  <circle cx="235" cy="220" r="22" fill="#bb8754" stroke="#fffdf8" stroke-width="4"/>
  <text x="183" y="278" fill="#bb8754" font-family="Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">DADOS</text>
  <circle cx="820" cy="220" r="22" fill="#2e7564" stroke="#fffdf8" stroke-width="4"/>
  <text x="768" y="278" fill="#2e7564" font-family="Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">FERRAMENTAS</text>
  <circle cx="235" cy="500" r="22" fill="#7652a8" stroke="#fffdf8" stroke-width="4"/>
  <text x="183" y="558" fill="#7652a8" font-family="Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">MEMÓRIA</text>
  <circle cx="820" cy="500" r="22" fill="#9c5856" stroke="#fffdf8" stroke-width="4"/>
  <text x="768" y="558" fill="#9c5856" font-family="Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">PERMISSÃO</text>

  <circle cx="600" cy="360" r="85" fill="#3d235c" stroke="#fffdf8" stroke-width="4"/>
  <text x="554" y="368" fill="#fffdf8" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1.5">MCP</text>
  <text x="335" y="605" fill="#6c6670" font-family="Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">um contrato comum — não uma arquitetura pronta</text>
</svg>
