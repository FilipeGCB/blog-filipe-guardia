<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Caderno de Sistemas Reais</title>
  <desc id="desc">Uma operação real se torna estrutura, sistema e agente governado.</desc>
  <rect width="1200" height="760" fill="#f4f0e9"/>
  <path d="M0 94H1200M0 650H1200M72 0V760M1128 0V760" stroke="#d9d1c5" stroke-width="1" opacity=".8"/>
  <circle cx="1038" cy="100" r="180" fill="#7652a8" opacity=".08"/>
  <circle cx="110" cy="650" r="142" fill="#bb8754" opacity=".08"/>
  <text x="86" y="112" fill="#3d235c" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1.5">CADERNO DE SISTEMAS REAIS</text><text x="86" y="145" fill="#6c6670" font-family="Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">operação → estrutura → sistema → agente</text><rect x="132" y="300" width="188" height="124" rx="14" fill="#fffdf8" stroke="#bb8754" stroke-width="3"/><text x="152" y="368" fill="#bb8754" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">OPERAÇÃO</text><path d="M320 362L392 362" stroke="#bdb2a3" stroke-width="4"  fill="none"/><rect x="400" y="300" width="188" height="124" rx="14" fill="#fffdf8" stroke="#7652a8" stroke-width="3"/><text x="420" y="368" fill="#7652a8" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">ESTRUTURA</text><path d="M588 362L660 362" stroke="#bdb2a3" stroke-width="4"  fill="none"/><rect x="668" y="300" width="188" height="124" rx="14" fill="#fffdf8" stroke="#3d235c" stroke-width="3"/><text x="688" y="368" fill="#3d235c" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">SISTEMA</text><path d="M856 362L928 362" stroke="#bdb2a3" stroke-width="4"  fill="none"/><rect x="936" y="300" width="188" height="124" rx="14" fill="#3d235c" stroke="#2e7564" stroke-width="3"/><text x="956" y="368" fill="#fffdf8" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">AGENTE</text><text x="320" y="560" fill="#3d235c" font-family="Arial, sans-serif" font-size="19" font-weight="650" letter-spacing="1.5">ferramentas só entram quando o problema já tem forma</text>
</svg>
