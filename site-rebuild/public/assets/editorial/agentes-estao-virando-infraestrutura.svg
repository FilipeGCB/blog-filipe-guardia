<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Agentes estão virando infraestrutura</title>
  <desc id="desc">Um modelo no centro se conecta a uma camada de harness com sessão, contexto, ferramentas, aprovações e execução, que por sua vez sustenta o trabalho do agente.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101426"/>
      <stop offset="1" stop-color="#25143f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b8cff"/>
      <stop offset="1" stop-color="#5de0d2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <circle cx="265" cy="338" r="92" fill="#171d35" stroke="#9b8cff" stroke-width="4"/>
  <text x="265" y="326" text-anchor="middle" fill="#f5f3ff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">MODELO</text>
  <text x="265" y="365" text-anchor="middle" fill="#b9b3d8" font-family="Inter,Arial,sans-serif" font-size="18">raciocínio</text>
  <path d="M357 338 H438" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M423 323 L441 338 L423 353" fill="none" stroke="#5de0d2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="450" y="145" width="390" height="386" rx="34" fill="#181c31" stroke="#6656b8" stroke-width="3"/>
  <text x="645" y="203" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">HARNESS</text>
  <text x="645" y="234" text-anchor="middle" fill="#b9b3d8" font-family="Inter,Arial,sans-serif" font-size="18">infraestrutura de execução</text>
  <g font-family="Inter,Arial,sans-serif" font-size="20" fill="#f4f1ff">
    <rect x="493" y="274" width="140" height="58" rx="16" fill="#29234c"/><text x="563" y="310" text-anchor="middle">sessão</text>
    <rect x="657" y="274" width="140" height="58" rx="16" fill="#243b45"/><text x="727" y="310" text-anchor="middle">contexto</text>
    <rect x="493" y="353" width="140" height="58" rx="16" fill="#243b45"/><text x="563" y="389" text-anchor="middle">ferramentas</text>
    <rect x="657" y="353" width="140" height="58" rx="16" fill="#29234c"/><text x="727" y="389" text-anchor="middle">aprovação</text>
    <rect x="575" y="432" width="140" height="58" rx="16" fill="#30365c"/><text x="645" y="468" text-anchor="middle">execução</text>
  </g>
  <path d="M840 338 H916" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M901 323 L919 338 L901 353" fill="none" stroke="#5de0d2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="930" y="246" width="180" height="184" rx="28" fill="#132b32" stroke="#5de0d2" stroke-width="4"/>
  <text x="1020" y="315" text-anchor="middle" fill="#f4fffd" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">TRABALHO</text>
  <text x="1020" y="351" text-anchor="middle" fill="#c2e8e3" font-family="Inter,Arial,sans-serif" font-size="18">arquivos</text>
  <text x="1020" y="381" text-anchor="middle" fill="#c2e8e3" font-family="Inter,Arial,sans-serif" font-size="18">sistemas</text>
  <text x="1020" y="411" text-anchor="middle" fill="#c2e8e3" font-family="Inter,Arial,sans-serif" font-size="18">ações</text>
  <text x="70" y="85" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">O agente está ganhando uma camada própria</text>
  <text x="70" y="610" fill="#aaa5c5" font-family="Inter,Arial,sans-serif" font-size="20">O modelo continua central — mas execução longa, estado e ferramentas deixam de ser detalhes invisíveis.</text>
</svg>
