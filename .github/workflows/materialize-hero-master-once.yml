name: Materialize authoritative hero master once

on:
  pull_request:
    types: [synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'feat/public-qa-positioning-fix-v1' && hashFiles('.hero-ingest/part-001.bin') != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json

      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci

      - name: Materialize and validate authoritative source
        run: |
          set -euo pipefail
          target="site-rebuild/assets-source/editorial/portraits/filipe/home/hero-approved-master.webp"
          cat .hero-ingest/part-*.bin > "$target"
          node --input-type=module <<'NODE'
          import sharp from './site-rebuild/node_modules/sharp/lib/index.js';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';

          const target = 'site-rebuild/assets-source/editorial/portraits/filipe/home/hero-approved-master.webp';
          const expectedSha = 'd61311519543dbc1774d49746d0a10b3f83b9eede45ce1fa0e6fe96321bde88e';
          const expectedBytes = 218440;
          const metadata = await sharp(target).metadata();
          const bytes = readFileSync(target);
          const sha = createHash('sha256').update(bytes).digest('hex');
          if (metadata.width !== 1536 || metadata.height !== 1024) {
            throw new Error(`Expected authoritative 1536x1024 source, got ${metadata.width}x${metadata.height}`);
          }
          if (bytes.length !== expectedBytes) throw new Error(`Expected ${expectedBytes} bytes, got ${bytes.length}`);
          if (sha !== expectedSha) throw new Error(`Expected sha256=${expectedSha}, got ${sha}`);
          console.log(`hero-master: ${metadata.width}x${metadata.height}; ${bytes.length} bytes; sha256=${sha}`);
          NODE

      - name: Generate and verify responsive hero derivatives
        working-directory: site-rebuild
        run: |
          set -euo pipefail
          npm run images:build
          npm run images:verify
          npm run test:image-policy

      - name: Run deterministic release gates before cleanup
        working-directory: site-rebuild
        run: npm run check

      - name: Remove all hero transport workarounds
        run: |
          set -euo pipefail
          rm -rf .hero-ingest
          rm -rf .hero-transfer
          rm -rf assets/hero
          rm -f hero-portrait.js
          rm -f site-rebuild/assets-source/editorial/portraits/filipe/home/hero-approved-master.png
          find site-rebuild -type f \( -name '*.b64' -o -name '*hero*base64*.txt' -o -name '*hero-approved.part*.txt' \) -delete
          rm .github/workflows/materialize-hero-master-once.yml

          test ! -e .hero-ingest
          test ! -e .hero-transfer
          test ! -e assets/hero
          test ! -e hero-portrait.js
          test ! -e .github/workflows/materialize-hero-master-once.yml
          ! find . -type f \( -name '*.b64' -o -path './assets/hero/filipe-home-*.txt' \) -print -quit | grep -q .

      - name: Commit canonical source and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: materialize authoritative hero and remove transport workarounds"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
