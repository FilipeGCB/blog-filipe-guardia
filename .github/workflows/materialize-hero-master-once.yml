name: Materialize approved hero master once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'feat/public-qa-positioning-fix-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json

      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci

      - name: Download and validate approved 4K master
        env:
          HERO_URL: "https://media.canva.com/v2/image-resize/format:WEBP/height:2160/quality:94/uri:ifs%3A%2F%2FM%2F127b0dc3-5131-4309-b672-2fcc3ac3daed/watermark:F/width:3840?csig=AAAAAAAAAAAAAAAAAAAAAMGtCho74EJGOR2tlGXih5XJI-vVGlZJzUXgZRf7uBZl&exp=1788844316&osig=AAAAAAAAAAAAAAAAAAAAAHziMmnRtZopngc85XtsypXcVdrG_e7OdLcpuQlC6RaU&signer=media-rpc"
        run: |
          set -euo pipefail
          target="site-rebuild/assets-source/editorial/portraits/filipe/home/hero-approved-master.webp"
          curl --fail --location --silent --show-error "$HERO_URL" --output "$target"
          node --input-type=module <<'NODE'
          import sharp from './site-rebuild/node_modules/sharp/lib/index.js';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';

          const target = 'site-rebuild/assets-source/editorial/portraits/filipe/home/hero-approved-master.webp';
          const metadata = await sharp(target).metadata();
          if (metadata.width !== 3840 || metadata.height !== 2160) {
            throw new Error(`Expected 3840x2160, got ${metadata.width}x${metadata.height}`);
          }
          const bytes = readFileSync(target);
          if (bytes.length < 100000) throw new Error(`Suspiciously small master: ${bytes.length} bytes`);
          const sha = createHash('sha256').update(bytes).digest('hex');

          const manifestPath = 'site-rebuild/src/data/editorialImageManifest.json';
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          manifest['portrait:filipe:home'].sourceSha256 = sha;
          writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

          const readmePath = 'site-rebuild/assets-source/editorial/portraits/filipe/home/README.md';
          let readme = readFileSync(readmePath, 'utf8');
          readme = readme.replace(/SHA-256:.*\n/g, '');
          readme = readme.replace('Canonical target: 3840 × 2160 (16:9)  \n', `Canonical target: 3840 × 2160 (16:9)  \nSHA-256: \`${sha}\`  \n`);
          writeFileSync(readmePath, readme);
          console.log(`hero-master: ${metadata.width}x${metadata.height}; ${bytes.length} bytes; sha256=${sha}`);
          NODE

      - name: Commit binary master and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-hero-master-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore approved high-density hero master"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
