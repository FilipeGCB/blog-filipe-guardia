name: Materialize authoritative hero master once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'feat/public-qa-positioning-fix-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json

      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci

      - name: Materialize and validate authoritative upload
        env:
          HERO_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:1024/quality:100/uri:ifs%3A%2F%2FM%2F3475f3d1-762e-4f6c-8c23-e81162f9cf33/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAAFmYF1IvUpniDFWfaRwwOo47IxXBCT2Nny_IA0sUQwb0&exp=1788937959&osig=AAAAAAAAAAAAAAAAAAAAABoO3dvsFh7o5KgDokNIB_EFuzMPJ53Yidgqav0dMGN5&signer=media-rpc&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          target="site-rebuild/assets-source/editorial/portraits/filipe/home/hero-approved-master.png"
          curl --fail --location --silent --show-error "$HERO_URL" --output "$target"
          node --input-type=module <<'NODE'
          import sharp from './site-rebuild/node_modules/sharp/lib/index.js';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';

          const target = 'site-rebuild/assets-source/editorial/portraits/filipe/home/hero-approved-master.png';
          const metadata = await sharp(target).metadata();
          if (metadata.width !== 1536 || metadata.height !== 1024) {
            throw new Error(`Expected authoritative 1536x1024 upload, got ${metadata.width}x${metadata.height}`);
          }
          const bytes = readFileSync(target);
          if (bytes.length < 300000) throw new Error(`Suspiciously small authoritative master: ${bytes.length} bytes`);
          const sha = createHash('sha256').update(bytes).digest('hex');

          const manifestPath = 'site-rebuild/src/data/editorialImageManifest.json';
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          manifest['portrait:filipe:home'].sourceSha256 = sha;
          writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

          const readmePath = 'site-rebuild/assets-source/editorial/portraits/filipe/home/README.md';
          let readme = readFileSync(readmePath, 'utf8');
          readme = readme.replace(/Canonical SHA-256:.*\n/, `Canonical SHA-256: \`${sha}\`  \n`);
          writeFileSync(readmePath, readme);
          console.log(`hero-master: ${metadata.width}x${metadata.height}; ${bytes.length} bytes; sha256=${sha}`);
          NODE

      - name: Generate and verify responsive hero derivatives
        working-directory: site-rebuild
        run: |
          set -euo pipefail
          npm run images:build
          npm run images:verify
          npm run test:image-policy

      - name: Remove all hero transport workarounds
        run: |
          set -euo pipefail
          rm -rf .hero-transfer
          rm -rf assets/hero
          rm -f hero-portrait.js
          rm -f site-rebuild/assets-source/editorial/portraits/filipe/home/hero-approved-master.webp
          find site-rebuild -type f \( -name '*.b64' -o -name '*hero*base64*.txt' -o -name '*hero-approved.part*.txt' \) -delete
          rm .github/workflows/materialize-hero-master-once.yml

          test ! -e .hero-transfer
          test ! -e assets/hero
          test ! -e hero-portrait.js
          test ! -e .github/workflows/materialize-hero-master-once.yml
          ! find . -type f \( -name '*.b64' -o -path './assets/hero/filipe-home-*.txt' \) -print -quit | grep -q .

      - name: Commit canonical source and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: materialize authoritative hero and remove transport workarounds"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
