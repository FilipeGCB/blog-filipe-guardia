name: Temporary Guard.IA HQ materializer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-materialize-guardia-hq.yml'

permissions:
  contents: write

jobs:
  materialize-fix-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/guardia-header-hq-v2
          fetch-depth: 0
      - name: Rebuild exact binary assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site-rebuild/public/assets/brand
          cat .transport/guardia/static/part-* | tr -d '\r\n' | base64 --decode > site-rebuild/public/assets/brand/guardia-g-hq.webp
          cat .transport/guardia/video/part-* | tr -d '\r\n' | base64 --decode > site-rebuild/public/assets/brand/guardia-lockup-intro-hq.webm
          test "$(stat -c%s site-rebuild/public/assets/brand/guardia-g-hq.webp)" = "27358"
          test "$(stat -c%s site-rebuild/public/assets/brand/guardia-lockup-intro-hq.webm)" = "86474"
          echo 'a3d3cfa213d91fd8d904885dc4017554125e7635ac1f10410989cf02c72f517d  site-rebuild/public/assets/brand/guardia-g-hq.webp' | sha256sum --check --strict
          echo 'e933ef915fa36390eaf9a2316da455099faaab494d83430a7cd8a558c04e307d  site-rebuild/public/assets/brand/guardia-lockup-intro-hq.webm' | sha256sum --check --strict
      - name: Commit clean correction branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-rebuild/public/assets/brand/guardia-g-hq.webp site-rebuild/public/assets/brand/guardia-lockup-intro-hq.webm
          git rm -r .transport
          git rm -f .github/workflows/materialize-guardia-hq.yml || true
          git rm -f .probe-ignore.txt || true
          git commit -m 'fix: materialize verified Guard.IA HQ assets'
          git push origin HEAD:fix/guardia-header-hq-v2
