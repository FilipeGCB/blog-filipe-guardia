name: Hotfix Pages regression RED

on:
  pull_request:
    branches: [main]
    paths:
      - 'site-rebuild/tests/publication-architecture.test.mjs'
      - '.github/workflows/hotfix-pages-regression-red.yml'
      - '.github/workflows/deploy-editorial-site.yml'

permissions:
  contents: read

jobs:
  publication-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run publication architecture contract
        working-directory: site-rebuild
        run: node --test tests/publication-architecture.test.mjs
