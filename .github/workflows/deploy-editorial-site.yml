name: Build and deploy editorial site

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site-rebuild/**'
      - '.github/workflows/deploy-editorial-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json
      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci
      - name: Verify content and build
        working-directory: site-rebuild
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check
          npm run build
          npm run preserve:legacy
          npm run audit:routes
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-rebuild/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
