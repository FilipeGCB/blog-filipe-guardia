name: Build and deploy editorial site

on:
  push:
    branches: [main]
  pull_request:
    types: [ready_for_review]
    paths:
      - 'site-rebuild/**'
      - '.github/workflows/deploy-editorial-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cost policy: keep redesign PRs as draft while iterating. This validation
  # runs once when the PR is explicitly marked ready, or manually on demand.
  validate-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json
      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci
      - name: Validate content, assets and types
        working-directory: site-rebuild
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run check

  # Run the expensive browser matrix once, at the explicit final PR gate.
  visual-qa:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json
      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci
      - name: Install Chromium
        working-directory: site-rebuild
        run: npx playwright install --with-deps chromium
      - name: Build editorial site
        working-directory: site-rebuild
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Run multi-viewport visual smoke gate
        working-directory: site-rebuild
        run: npm run test:visual

  # Build/deploy only after code reaches main. No branch push builds.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json
      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci
      - name: Verify content and build
        working-directory: site-rebuild
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check
          npm run build
          npm run preserve:legacy
          npm run audit:routes
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-rebuild/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
