name: Manual source validation

# The source repository is designed to become private. Routine validation,
# builds and releases run locally so normal blog edits consume zero private
# GitHub Actions minutes. Keep this workflow only as an explicit emergency gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-source-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json
      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci
      - name: Run deterministic release gates
        working-directory: site-rebuild
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check
          npm run build:ci
          npm run preserve:legacy
          npm run audit:routes
      - name: Install Chromium
        working-directory: site-rebuild
        run: npx playwright install --with-deps chromium
      - name: Run multi-viewport visual gate
        working-directory: site-rebuild
        run: npm run test:visual
