name: Build and deploy editorial site

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'site-rebuild/**'
      - '.github/workflows/deploy-editorial-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Materialize canonical Guard.IA binaries once
        env:
          STATIC_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6140-820e-af7b-3c8ba59a7f35/raw?se=2026-09-17T02%3A15%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=379fa38b-9967-57d8-96c0-e70b0ec80d7e&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T20%3A07%3A14Z&ske=2026-09-17T20%3A07%3A14Z&sks=b&skv=2026-02-06&sig=DRX5tvMUwPd7jFVWQbpU2X8fOgTxGCkWWgxii340AkQ%3D'
          VIDEO_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-5d6c-820e-9510-2975ccdee386/raw?se=2026-09-17T02%3A15%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=a2e27136-4855-52aa-b685-ff2260b2dfa1&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T20%3A02%3A14Z&ske=2026-09-17T20%3A02%3A14Z&sks=b&skv=2026-02-06&sig=MAOZqpEzlUdkgnnMfHXRVGpYpKIj6k1WTUJnpQZ2CHo%3D'
        run: |
          set -euo pipefail
          static='site-rebuild/public/assets/brand/guardia-g-hq.webp'
          video='site-rebuild/public/assets/brand/guardia-lockup-intro-hq.webm'
          if [ -f "$static" ] && [ -f "$video" ]; then
            echo 'Canonical Guard.IA assets already materialized.'
            exit 0
          fi
          mkdir -p "$(dirname "$static")"
          curl --fail --silent --show-error --location --retry 3 "$STATIC_URL" -o "$static"
          curl --fail --silent --show-error --location --retry 3 "$VIDEO_URL" -o "$video"
          echo '1b3961dfb3d73e546651979f5dc143073812c48552d71521711ed3bf43b25fd3  site-rebuild/public/assets/brand/guardia-g-hq.webp' | sha256sum -c -
          echo '0e97b3d4808e8b537360bf6beab56c134befad8267c8d6922c4960bf1b91a4ca  site-rebuild/public/assets/brand/guardia-lockup-intro-hq.webm' | sha256sum -c -
          rm -rf .transport
          rm -f site-rebuild/public/assets/brand/guardia-g.jpg site-rebuild/public/assets/brand/guardia-lockup-intro.webm .probe-ignore.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: materialize full-quality Guard.IA header assets'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json
      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci
      - name: Validate release contracts
        working-directory: site-rebuild
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check
          npm run build
          npm run preserve:legacy
          npm run audit:routes
      - name: Install Chromium
        working-directory: site-rebuild
        run: npx playwright install --with-deps chromium
      - name: Run multi-viewport visual smoke gate
        working-directory: site-rebuild
        run: npm run test:visual

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      smoke_route: ${{ steps.smoke.outputs.route }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json
      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci
      - name: Verify content and build
        working-directory: site-rebuild
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check
          npm run build
          npm run preserve:legacy
          npm run audit:routes
      - name: Select live smoke route
        id: smoke
        working-directory: site-rebuild
        run: |
          route="$(node --experimental-strip-types --input-type=module -e "import('./src/data/articles.ts').then(({ getSortedArticles }) => process.stdout.write('/artigos/' + getSortedArticles()[0].slug + '.html'))")"
          echo "route=$route" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-rebuild/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published route
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          ROUTE: ${{ needs.build.outputs.smoke_route }}
        run: |
          base="${PAGE_URL%/}"
          url="${base}${ROUTE}?deploy=${GITHUB_SHA}"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "$url" --output /tmp/published.html
          grep -Fq '<article' /tmp/published.html
          echo "Published route verified: ${base}${ROUTE}"
