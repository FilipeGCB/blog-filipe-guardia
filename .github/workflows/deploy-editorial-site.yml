name: Build and deploy editorial site

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'site-rebuild/**'
      - '.github/workflows/deploy-editorial-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Temporary hotfix while Pages still publishes repository root from main.
  # Keep Astro dist authoritative until the private-source/public-deploy cutover.
  validate-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json
      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci
      - name: Validate release contracts
        working-directory: site-rebuild
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check
          npm run build
          npm run preserve:legacy
          npm run audit:routes
      - name: Install Chromium
        working-directory: site-rebuild
        run: npx playwright install --with-deps chromium
      - name: Run multi-viewport visual smoke gate
        working-directory: site-rebuild
        run: npm run test:visual

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      smoke_route: ${{ steps.smoke.outputs.route }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json
      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci
      - name: Verify content and build
        working-directory: site-rebuild
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check
          npm run build
          npm run preserve:legacy
          npm run audit:routes
      - name: Install Chromium for publication QA
        working-directory: site-rebuild
        run: npx playwright install --with-deps chromium
      - name: Run mandatory multi-viewport publication QA
        working-directory: site-rebuild
        run: npm run test:visual
      - name: Select live smoke route
        id: smoke
        working-directory: site-rebuild
        run: |
          route="$(node --experimental-strip-types --input-type=module -e "import('./src/data/articles.ts').then(({ getSortedArticles }) => process.stdout.write('/artigos/' + getSortedArticles()[0].slug + '.html'))")"
          echo "route=$route" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-rebuild/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published route
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          ROUTE: ${{ needs.build.outputs.smoke_route }}
        run: |
          base="${PAGE_URL%/}"
          url="${base}${ROUTE}?deploy=${GITHUB_SHA}"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "$url" --output /tmp/published.html
          grep -Fq '<article' /tmp/published.html
          echo "Published route verified: ${base}${ROUTE}"
