name: Build and deploy editorial site

on:
  push:
    branches: [main]
  pull_request:
    types: [ready_for_review]
    paths:
      - 'site-rebuild/**'
      - '.github/workflows/deploy-editorial-site.yml'
  workflow_dispatch:

# TEMPORARY migration permission. Restored to read-only after the approved
# WebP masters are committed to the PR branch.
permissions:
  contents: write

concurrency:
  group: editorial-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head for one-time master migration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json
      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci
      - name: Materialize approved WebP masters
        working-directory: site-rebuild
        run: node scripts/materialize-approved-masters.mjs
      - name: Commit binary masters and remove base64 wrappers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site-rebuild/assets-source/editorial/portraits/filipe
          git diff --cached --quiet || git commit -m "chore: store approved portrait masters as WebP"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Validate release contracts
        working-directory: site-rebuild
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check
          npm run build:ci
          npm run preserve:legacy
          npm run audit:routes
      - name: Install Chromium
        working-directory: site-rebuild
        run: npx playwright install --with-deps chromium
      - name: Run multi-viewport visual smoke gate
        working-directory: site-rebuild
        run: npm run test:visual

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-rebuild/package-lock.json
      - name: Install dependencies
        working-directory: site-rebuild
        run: npm ci
      - name: Verify content and build
        working-directory: site-rebuild
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check
          npm run build:ci
          npm run preserve:legacy
          npm run audit:routes
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-rebuild/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
