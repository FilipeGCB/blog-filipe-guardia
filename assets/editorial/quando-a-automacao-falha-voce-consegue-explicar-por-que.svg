<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Observabilidade de uma automação</title><desc id="desc">Um fluxo de execução atravessa etapas enquanto métricas, logs e rastros tornam seu comportamento visível.</desc><rect width="1200" height="760" fill="#f4f1ea"/><g stroke="#d8d1c4" stroke-width="1" opacity=".55"><path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/><path d="M160 0V760M360 0V760M560 0V760M760 0V760M960 0V760"/></g><rect x="100" y="245" width="220" height="130" rx="18" fill="#ffffff" stroke="#6c4ea2" stroke-width="5"/><rect x="490" y="245" width="220" height="130" rx="18" fill="#ffffff" stroke="#b8873b" stroke-width="5"/><rect x="880" y="245" width="220" height="130" rx="18" fill="#ffffff" stroke="#4f7b68" stroke-width="5"/><circle cx="210" cy="310" r="24" fill="#6c4ea2"/><circle cx="600" cy="310" r="24" fill="#b8873b"/><circle cx="990" cy="310" r="24" fill="#4f7b68"/><path d="M320 310H490M710 310H880" stroke="#34313a" stroke-width="6" fill="none"/><g font-family="Arial, sans-serif" fill="#34313a"><text x="100" y="190" font-size="30" font-weight="700">EXECUÇÃO</text><text x="100" y="430" font-size="22">o trabalho acontece</text><text x="100" y="535" font-size="20" fill="#6c4ea2">MÉTRICAS</text><text x="490" y="535" font-size="20" fill="#b8873b">LOGS</text><text x="880" y="535" font-size="20" fill="#4f7b68">RASTROS</text><text x="100" y="575" font-size="17">quanto • quanto tempo</text><text x="490" y="575" font-size="17">qual evento • qual erro</text><text x="880" y="575" font-size="17">por onde passou</text></g><rect x="95" y="650" width="1010" height="4" fill="#34313a" opacity=".18"/></svg>