<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Três sinais de observabilidade</title><desc id="desc">Métricas, logs e rastros respondem perguntas complementares sobre uma mesma execução.</desc><rect width="1000" height="620" fill="#f7f4ed"/><g font-family="Arial, sans-serif"><rect x="70" y="90" width="250" height="330" rx="24" fill="#fff" stroke="#6c4ea2" stroke-width="4"/><text x="105" y="145" font-size="25" font-weight="700" fill="#6c4ea2">MÉTRICAS</text><text x="105" y="205" font-size="19" fill="#34313a">Algo mudou?</text><text x="105" y="245" font-size="17" fill="#5b5860">volume</text><text x="105" y="278" font-size="17" fill="#5b5860">latência</text><text x="105" y="311" font-size="17" fill="#5b5860">erros</text><text x="105" y="344" font-size="17" fill="#5b5860">capacidade</text><rect x="375" y="90" width="250" height="330" rx="24" fill="#fff" stroke="#b8873b" stroke-width="4"/><text x="410" y="145" font-size="25" font-weight="700" fill="#b8873b">LOGS</text><text x="410" y="205" font-size="19" fill="#34313a">O que ocorreu?</text><text x="410" y="245" font-size="17" fill="#5b5860">evento</text><text x="410" y="278" font-size="17" fill="#5b5860">erro</text><text x="410" y="311" font-size="17" fill="#5b5860">estado</text><text x="410" y="344" font-size="17" fill="#5b5860">decisão</text><rect x="680" y="90" width="250" height="330" rx="24" fill="#fff" stroke="#4f7b68" stroke-width="4"/><text x="715" y="145" font-size="25" font-weight="700" fill="#4f7b68">RASTROS</text><text x="715" y="205" font-size="19" fill="#34313a">Por onde passou?</text><text x="715" y="245" font-size="17" fill="#5b5860">etapas</text><text x="715" y="278" font-size="17" fill="#5b5860">dependências</text><text x="715" y="311" font-size="17" fill="#5b5860">tempo por etapa</text><text x="715" y="344" font-size="17" fill="#5b5860">correlação</text><text x="500" y="505" text-anchor="middle" font-size="24" font-weight="700" fill="#34313a">A mesma execução, vista por ângulos diferentes</text><text x="500" y="548" text-anchor="middle" font-size="18" fill="#5b5860">correlacionar sinais transforma dados soltos em uma história investigável</text></g></svg>