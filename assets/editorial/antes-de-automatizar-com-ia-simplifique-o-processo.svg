<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Antes de automatizar com IA, simplifique o processo</title><desc id="desc">Um fluxo longo e cheio de etapas é reduzido antes de chegar a uma camada de inteligência artificial.</desc><rect width="1200" height="675" rx="28" fill="#f5f1e8"/><g stroke="#d8d0c2" stroke-width="1"><path d="M0 135H1200M0 270H1200M0 405H1200M0 540H1200"/><path d="M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/></g><text x="72" y="92" fill="#25143f" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">Simplifique antes de automatizar</text><g font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle"><rect x="75" y="265" width="145" height="72" rx="16" fill="#ded7ea"/><text x="147" y="308" fill="#3a2853">entrada</text><rect x="270" y="265" width="145" height="72" rx="16" fill="#e5d5ae"/><text x="342" y="308" fill="#59451e">copiar</text><rect x="465" y="265" width="145" height="72" rx="16" fill="#ded7ea"/><text x="537" y="308" fill="#3a2853">conferir</text><rect x="660" y="265" width="145" height="72" rx="16" fill="#e5d5ae"/><text x="732" y="308" fill="#59451e">repassar</text></g><path d="M220 301H270M415 301H465M610 301H660" stroke="#8067a8" stroke-width="5"/><path d="M820 301H900" stroke="#5d8f78" stroke-width="7" stroke-linecap="round"/><path d="M878 282l25 19-25 19" fill="none" stroke="#5d8f78" stroke-width="7"/><rect x="915" y="220" width="210" height="165" rx="30" fill="#25143f"/><text x="1020" y="285" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">IA</text><text x="1020" y="322" text-anchor="middle" fill="#cfc5e3" font-family="Inter,Arial,sans-serif" font-size="17">só onde existe</text><text x="1020" y="348" text-anchor="middle" fill="#cfc5e3" font-family="Inter,Arial,sans-serif" font-size="17">ambiguidade</text><path d="M270 425H805" stroke="#b45d45" stroke-width="4" stroke-dasharray="10 10"/><text x="537" y="468" text-anchor="middle" fill="#8b4c3a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">eliminar · simplificar · automatizar</text><text x="72" y="610" fill="#5b5264" font-family="Inter,Arial,sans-serif" font-size="20">A melhor arquitetura não automatiza desperdício: primeiro redesenha o trabalho.</text></svg>